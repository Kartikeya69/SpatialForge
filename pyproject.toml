[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialforge"
version = "0.1.0"
description = "Reusable indoor capture and 3D reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "Pillow>=10,<13",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["spatialforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:xonsh"
